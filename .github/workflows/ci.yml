name: ci

on:
  push:
    branches: [main]
    # A push that touches only the documents or this file runs no
    # matrix. The next push that changes the code runs it.
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tag: [v2026.3, v2026.4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install the Goose release
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/goose"
          mkdir -p "$dest"
          tag="${{ matrix.tag }}"
          case "$RUNNER_OS" in
            Linux) asset="linux-x64.tar.gz" ;;
            macOS) asset="macos-arm64.tar.gz" ;;
            Windows) asset="windows-x64.zip" ;;
          esac
          # A busy GitHub CDN answers a release download with a 504. The retry rides it out.
          url="https://github.com/aardappel/goose/releases/download/${tag}/goose-${tag}-${asset}"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors "$url" -o "$dest/goose.zip"
            7z x -y -o"$dest" "$dest/goose.zip" > /dev/null
            exe=$(find "$dest" -type f -name goose.exe | head -1)
          else
            curl -fsSL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors "$url" -o "$dest/goose.tar.gz"
            tar -xzf "$dest/goose.tar.gz" -C "$dest"
            exe=$(find "$dest" -type f -name goose | head -1)
          fi
          chmod +x "$exe"
          bindir="$(dirname "$exe")"
          if [ "$RUNNER_OS" = Windows ]; then bindir="$(cygpath -w "$bindir")"; fi
          echo "$bindir" >> "$GITHUB_PATH"
          "$exe" --help | head -3

      - name: Check the entry file
        run: goose check sast.goose
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Run the test suite
        timeout-minutes: 10
        run: |
          set -o pipefail
          goose run test/run.goose 2>&1 | tee test-output.txt
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Run the examples
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for f in examples/*.goose; do
            echo "--- $f"
            goose run "$f"
          done
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Build the command and run it
        timeout-minutes: 15
        run: |
          set -euo pipefail
          goose build -o "$RUNNER_TEMP/sast" cmd/sast.goose
          # A clean tree exits 0.
          mkdir -p "$RUNNER_TEMP/clean"
          printf 'fn main() { }\n' > "$RUNNER_TEMP/clean/a.goose"
          "$RUNNER_TEMP/sast" "$RUNNER_TEMP/clean"
          # A tree with findings exits 1; -no-fail turns that to 0.
          if "$RUNNER_TEMP/sast" test/rules > out.txt; then echo "findings gave exit 0"; exit 1; fi
          grep -q "G101" out.txt
          "$RUNNER_TEMP/sast" -no-fail test/rules > /dev/null
          # The severity floor and the exclude list change the output.
          "$RUNNER_TEMP/sast" -no-fail -severity high test/rules | grep -q "G404"
          "$RUNNER_TEMP/sast" -no-fail -exclude G404,B311 test/rules > out.txt
          if grep -q "G404" out.txt; then echo "exclude kept G404"; exit 1; fi
          "$RUNNER_TEMP/sast" -no-fail -f json test/rules | grep -q '"rule":"G101"'
          # A bad flag and a bad rule ID end with exit 2.
          set +e
          "$RUNNER_TEMP/sast" -bogus test/rules 2> /dev/null; code=$?
          set -e
          test "$code" = 2
          "$RUNNER_TEMP/sast" -list-rules | grep -q "^G101 "
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Report the failure
        if: failure()
        run: |
          text=$(tail -c 2000 test-output.txt 2>/dev/null | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' '%0A')
          echo "::error title=The tests failed::${text}"
