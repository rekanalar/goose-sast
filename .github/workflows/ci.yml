name: ci

on:
  push:
    branches: [main]
    # A push that touches only the documents runs no matrix. A push
    # that changes this file runs the matrix, because a fix of the
    # workflow needs the matrix that finds it.
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tag: [v2026.3, v2026.4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install the Goose release
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/goose"
          mkdir -p "$dest"
          tag="${{ matrix.tag }}"
          case "$RUNNER_OS" in
            Linux) asset="linux-x64.tar.gz" ;;
            macOS) asset="macos-arm64.tar.gz" ;;
            Windows) asset="windows-x64.zip" ;;
          esac
          # A busy GitHub CDN answers a release download with a 504. The retry rides it out.
          url="https://github.com/aardappel/goose/releases/download/${tag}/goose-${tag}-${asset}"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors "$url" -o "$dest/goose.zip"
            7z x -y -o"$dest" "$dest/goose.zip" > /dev/null
            exe=$(find "$dest" -type f -name goose.exe | head -1)
          else
            curl -fsSL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors "$url" -o "$dest/goose.tar.gz"
            tar -xzf "$dest/goose.tar.gz" -C "$dest"
            exe=$(find "$dest" -type f -name goose | head -1)
          fi
          chmod +x "$exe"
          bindir="$(dirname "$exe")"
          if [ "$RUNNER_OS" = Windows ]; then bindir="$(cygpath -w "$bindir")"; fi
          echo "$bindir" >> "$GITHUB_PATH"
          "$exe" --help | head -3

      - name: Check the entry file
        run: goose check sast.goose
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Run the test suite
        timeout-minutes: 10
        run: |
          set -o pipefail
          goose run test/run.goose 2>&1 | tee test-output.txt
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Run the examples
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for f in examples/*.goose; do
            echo "--- $f"
            goose run "$f"
          done
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Build the command and run it
        timeout-minutes: 15
        run: |
          set -euo pipefail
          goose build -o "$RUNNER_TEMP/sast" cmd/sast.goose
          # A clean tree exits 0.
          mkdir -p "$RUNNER_TEMP/clean"
          printf 'fn main() { }\n' > "$RUNNER_TEMP/clean/a.goose"
          "$RUNNER_TEMP/sast" "$RUNNER_TEMP/clean"
          # A tree with findings exits 1; -no-fail turns that to 0.
          if "$RUNNER_TEMP/sast" test/rules > out.txt; then echo "findings gave exit 0"; exit 1; fi
          grep -q "G101" out.txt
          "$RUNNER_TEMP/sast" -no-fail test/rules > /dev/null
          # The severity floor and the exclude list change the output.
          "$RUNNER_TEMP/sast" -no-fail -severity high test/rules | grep -q "G404"
          "$RUNNER_TEMP/sast" -no-fail -exclude G404,B311 test/rules > out.txt
          if grep -q "G404" out.txt; then echo "exclude kept G404"; exit 1; fi
          "$RUNNER_TEMP/sast" -no-fail -f json test/rules | grep -q '"rule":"G101"'
          # The SARIF form writes one JSON object with the rule rows
          # and the results. The JSON module of Python reads it back.
          "$RUNNER_TEMP/sast" -no-fail -f sarif test/rules > sarif.json
          python3 -c "import json;d=json.load(open('sarif.json'));r=d['runs'][0];assert d['version']=='2.1.0';assert len(r['results'])>0;assert any(x['ruleId']=='G101' for x in r['results'])"
          # A symbolic link stays out of the walk. The loop cannot make
          # the walk read one file twice, and the link outside the tree
          # is not read. Windows cannot create a link from its shell.
          if [ "${RUNNER_OS:-Linux}" != "Windows" ]; then
            L="$RUNNER_TEMP/links"
            rm -rf "$L"
            mkdir -p "$L/out"
            printf 'let a = "0.0.0.0";\n' > "$L/out/x.goose"
            mkdir -p "$L/walk"
            ln -s "$L/out" "$L/walk/link"
            ln -s . "$L/walk/loop"
            set +e
            "$RUNNER_TEMP/sast" "$L/walk" > "$L/out.txt"
            set -e
            grep -q "0 finding(s)" "$L/out.txt"
            grep -q "2 file(s) skipped" "$L/out.txt"
          fi
          # The custom rules run like built-in rules and obey a
          # suppression comment.
          R="$RUNNER_TEMP/rules.json"
          printf '{ "rules": [ { "id": "HOUSE01", "severity": "high", "kind": "ident", "text": "legacy_login", "message": "the forbidden call" } ] }\n' > "$R"
          printf 'legacy_login(u, p);\n' > "$RUNNER_TEMP/clean/c.goose"
          set +e
          "$RUNNER_TEMP/sast" -rules "$R" "$RUNNER_TEMP/clean" > "$R.out"
          set -e
          grep -q "HOUSE01" "$R.out"
          printf 'legacy_login(u, p); // nosec\n' > "$RUNNER_TEMP/clean/c.goose"
          "$RUNNER_TEMP/sast" -rules "$R" "$RUNNER_TEMP/clean" | grep -q "0 finding"
          # A bad rule file is a fault.
          printf '{ "rules": [ { "id": "G101", "severity": "high", "kind": "ident", "text": "x" } ] }\n' > "$R"
          set +e
          "$RUNNER_TEMP/sast" -rules "$R" "$RUNNER_TEMP/clean" 2> /dev/null
          code=$?
          set -e
          test "$code" = 2
          # A bad flag and a bad rule ID end with exit 2.
          set +e
          "$RUNNER_TEMP/sast" -bogus test/rules 2> /dev/null; code=$?
          set -e
          test "$code" = 2
          "$RUNNER_TEMP/sast" -list-rules | grep -q "^G101 "
          # The block suppression covers the lines between the markers.
          printf '// nosec:start\nlet a = "0.0.0.0";\n// nosec:end\n' > "$RUNNER_TEMP/clean/b.goose"
          "$RUNNER_TEMP/sast" "$RUNNER_TEMP/clean" | grep -q "0 finding"
          # Several targets in one run. The summary counts the files of
          # all targets.
          mkdir -p "$RUNNER_TEMP/t1" "$RUNNER_TEMP/t2"
          printf 'listen("0.0.0.0", p);\n' > "$RUNNER_TEMP/t1/x.goose"
          printf 'let password = "hunter2hunter2";\n' > "$RUNNER_TEMP/t2/y.goose"
          "$RUNNER_TEMP/sast" -no-fail "$RUNNER_TEMP/t1" "$RUNNER_TEMP/t2" > out.txt
          grep -q "2 file(s) scanned" out.txt
          grep -q "G101" out.txt
          # A target that does not exist is a fault.
          set +e
          "$RUNNER_TEMP/sast" "$RUNNER_TEMP/t1" "$RUNNER_TEMP/nosuch" 2> /dev/null
          code=$?
          set -e
          test "$code" = 2
          # The config file holds the settings of a run.
          printf '{ "min_severity": "high" }\n' > "$RUNNER_TEMP/cfg.json"
          "$RUNNER_TEMP/sast" -config "$RUNNER_TEMP/cfg.json" -no-fail "$RUNNER_TEMP/t1" | grep -q "0 finding"
          # A flag wins over the config file.
          "$RUNNER_TEMP/sast" -config "$RUNNER_TEMP/cfg.json" -severity low -no-fail "$RUNNER_TEMP/t2" | grep -q "G101"
          # A broken config file is a fault.
          printf '{ "nope": 1 }\n' > "$RUNNER_TEMP/bad.json"
          set +e
          "$RUNNER_TEMP/sast" -config "$RUNNER_TEMP/bad.json" "$RUNNER_TEMP/t1" 2> /dev/null
          code=$?
          set -e
          test "$code" = 2
          # The rule files of a run merge.
          printf '{ "rules": [ { "id": "HA01", "severity": "high", "kind": "ident", "text": "legacy_login" } ] }\n' > "$RUNNER_TEMP/r1.json"
          printf '{ "rules": [ { "id": "HA02", "severity": "high", "kind": "ident", "text": "old_pass" } ] }\n' > "$RUNNER_TEMP/r2.json"
          printf 'legacy_login(u, p);\nold_pass(u, p);\n' > "$RUNNER_TEMP/t1/x.goose"
          "$RUNNER_TEMP/sast" -no-fail -rules "$RUNNER_TEMP/r1.json" -rules "$RUNNER_TEMP/r2.json" "$RUNNER_TEMP/t1" > out.txt
          grep -q "HA01" out.txt
          grep -q "HA02" out.txt
          # A file target beside a directory target.
          "$RUNNER_TEMP/sast" -no-fail "$RUNNER_TEMP/t1" "$RUNNER_TEMP/t2/y.goose" > out.txt
          grep -q "2 file(s) scanned" out.txt
          # The file count bound covers the targets of a run.
          "$RUNNER_TEMP/sast" -no-fail -max-files 1 "$RUNNER_TEMP/t1" "$RUNNER_TEMP/t2" > out.txt
          grep -q "1 file(s) scanned" out.txt
          grep -q "1 file(s) skipped" out.txt
          # A directory that two targets name is walked once.
          "$RUNNER_TEMP/sast" -no-fail "$RUNNER_TEMP/t2" "$RUNNER_TEMP/t2" > out.txt
          grep -q "1 file(s) scanned" out.txt
          grep -q "1 file(s) skipped" out.txt
          # The file count bound covers a file target too.
          "$RUNNER_TEMP/sast" -no-fail -max-files 1 "$RUNNER_TEMP/t2/y.goose" "$RUNNER_TEMP/t1/x.goose" > out.txt
          grep -q "1 file(s) scanned" out.txt
          grep -q "1 file(s) skipped" out.txt
          # The confidence flag takes low, medium or high.
          set +e
          "$RUNNER_TEMP/sast" -confidence critical "$RUNNER_TEMP/t1" 2> /dev/null
          code=$?
          set -e
          test "$code" = 2
          # A bad value of the config file is a fault under a flag too.
          printf '{ "min_severity": "huge" }\n' > "$RUNNER_TEMP/huge.json"
          set +e
          "$RUNNER_TEMP/sast" -config "$RUNNER_TEMP/huge.json" -severity low "$RUNNER_TEMP/t1" 2> /dev/null
          code=$?
          set -e
          test "$code" = 2
          # The config file names the rule files and the policy file.
          # The path in the file holds no backslash, because a
          # backslash is an escape in JSON and the path of the runner
          # on Windows holds one.
          printf '{ "rules": [ { "id": "HA02", "severity": "high", "kind": "ident", "text": "old_pass" } ] }\n' > ci-rules.json
          printf '{ "rules": "ci-rules.json" }\n' > ci-config.json
          "$RUNNER_TEMP/sast" -no-fail -config ci-config.json "$RUNNER_TEMP/t1" > out.txt
          grep -q "HA02" out.txt
          printf '{ "policy": "test/deps/policy.json", "advisories": "test/deps/advisories.json" }\n' > "$RUNNER_TEMP/cfg3.json"
          set +e
          "$RUNNER_TEMP/sast" -config "$RUNNER_TEMP/cfg3.json" test/deps/root.goose > out.txt
          code=$?
          set -e
          test "$code" = 7
          # The dependency checks read the policy and the advisory file.
          set +e
          "$RUNNER_TEMP/sast" -policy test/deps/policy.json \
            -advisories test/deps/advisories.json test/deps/root.goose > out.txt
          set -e
          grep -q "BAN" out.txt
          grep -q "ADVISORY" out.txt
          # The exit code of the dependency checks is the bitset of
          # cargo-deny: advisories 1, bans 2, licenses 4, sources 8.
          set +e
          "$RUNNER_TEMP/sast" -policy test/deps/policy.json \
            -advisories test/deps/advisories.json test/deps/root.goose > /dev/null
          code=$?
          set -e
          test "$code" = 7
          # A policy that does not parse is a fault.
          printf '{ "bans": ' > "$RUNNER_TEMP/bad.json"
          set +e
          "$RUNNER_TEMP/sast" -policy "$RUNNER_TEMP/bad.json" test/deps/root.goose 2> /dev/null
          code=$?
          set -e
          test "$code" = 2
          # A file that is no regular file is not read. A pipe as a
          # target ends the run at once, and a device as a rule file is
          # a fault. Windows has no pipe and no device of this kind.
          if [ "${RUNNER_OS:-Linux}" != "Windows" ]; then
            mkfifo "$RUNNER_TEMP/pipe"
            set +e
            "$RUNNER_TEMP/sast" "$RUNNER_TEMP/pipe" 2> /dev/null
            code=$?
            set -e
            test "$code" = 2
            printf '{ "rules": "/dev/zero" }\n' > "$RUNNER_TEMP/dev.json"
            set +e
            "$RUNNER_TEMP/sast" -config "$RUNNER_TEMP/dev.json" "$RUNNER_TEMP/t1" 2> /dev/null
            code=$?
            set -e
            test "$code" = 2
          fi
          # A hostile byte in a fault message is escaped. The key holds
          # the UTF-8 form of a C1 control.
          printf '{ "\xc2\x9b": 1 }\n' > "$RUNNER_TEMP/c1.json"
          set +e
          "$RUNNER_TEMP/sast" -config "$RUNNER_TEMP/c1.json" "$RUNNER_TEMP/t1" 2> err.txt
          code=$?
          set -e
          test "$code" = 2
          grep -q 'xc2' err.txt
          if LC_ALL=C grep -q "$(printf '\xc2\x9b')" err.txt; then echo "raw C1 byte in the fault message"; exit 1; fi
          # A key that the config file holds twice is a fault.
          printf '{ "min_severity": "low", "min_severity": "high" }\n' > "$RUNNER_TEMP/dup.json"
          set +e
          "$RUNNER_TEMP/sast" -config "$RUNNER_TEMP/dup.json" "$RUNNER_TEMP/t1" 2> /dev/null
          code=$?
          set -e
          test "$code" = 2
          # The command reads no config file of the current directory
          # when the -no-config flag names that choice.
          printf '{ "min_severity": "critical" }\n' > .goose-sast.json
          "$RUNNER_TEMP/sast" -no-fail "$RUNNER_TEMP/t2" > out.txt
          if grep -q "G101" out.txt; then echo "the config file of the directory was not read"; exit 1; fi
          "$RUNNER_TEMP/sast" -no-fail -no-config "$RUNNER_TEMP/t2" > out.txt
          grep -q "G101" out.txt
          rm -f .goose-sast.json
          # The rule files of the config file join the rule files of the
          # command line.
          printf '{ "rules": "ci-rules.json" }\n' > ci-config2.json
          "$RUNNER_TEMP/sast" -no-fail -config ci-config2.json \
            -rules "$RUNNER_TEMP/r1.json" "$RUNNER_TEMP/t1" > out.txt
          grep -q "HA01" out.txt
          grep -q "HA02" out.txt
          # A next-line directive silences the line below it. The unused
          # report names a suppression that silenced nothing, and only
          # when the flag is on.
          printf '// nosec:next\nlisten("0.0.0.0", p);\n// nosec G204\nlet a = 1;\n' > nl.goose
          "$RUNNER_TEMP/sast" -no-fail nl.goose > out.txt
          if grep -q "G102" out.txt; then echo "the next-line directive did not hold"; exit 1; fi
          "$RUNNER_TEMP/sast" -no-fail -report-unused nl.goose 2> err.txt
          grep -q "nl.goose:3: unused suppression \[G204\]" err.txt
          "$RUNNER_TEMP/sast" -no-fail nl.goose 2> err.txt
          if grep -q "unused suppression" err.txt; then echo "the report was on without the flag"; exit 1; fi
          # The exit codes stay as they are with the flag: 1 for a
          # finding, 0 for a clean file, 2 for a fault.
          printf 'listen("0.0.0.0", p);\n' > f.goose
          code=0; "$RUNNER_TEMP/sast" -report-unused f.goose 2> /dev/null > /dev/null || code=$?
          test "$code" = 1
          printf 'let a = 1;\n' > c.goose
          "$RUNNER_TEMP/sast" -report-unused c.goose > /dev/null 2> /dev/null
          code=0; "$RUNNER_TEMP/sast" -report-unused nosuch.goose 2> /dev/null > /dev/null || code=$?
          test "$code" = 2
          # A call through the module name reports.
          printf 'let a = md5::sum(x);\n' > q.goose
          "$RUNNER_TEMP/sast" -no-fail q.goose | grep -q "G401"
          # A name of one function does not reach another function.
          printf 'fn one() {\n    let c = args();\n    run(c);\n}\nfn two() {\n    let c = 1;\n    run(c);\n}\n' > sc.goose
          "$RUNNER_TEMP/sast" -no-fail sc.goose > out.txt
          grep -q "sc.goose:3:5.*G702" out.txt
          if grep -q "sc.goose:7:.*G702" out.txt; then echo "a name crossed a function"; exit 1; fi
          # A regex rule reports each match. An anchor is a fault that
          # names the rule.
          printf '{"rules":[{"id":"CO801","severity":"high","kind":"regex","text":"TODO\\\\([a-z]+\\\\)"}]}\n' > rx.json
          printf 'a\n  TODO(jim) x TODO(ann)\n' > rx.goose
          "$RUNNER_TEMP/sast" -no-fail -rules rx.json rx.goose > out.txt
          grep -q "rx.goose:2:3.*CO801" out.txt
          grep -q "rx.goose:2:15.*CO801" out.txt
          printf '{"rules":[{"id":"CO802","severity":"low","kind":"regex","text":"^abc"}]}\n' > rxbad.json
          code=0; "$RUNNER_TEMP/sast" -rules rxbad.json rx.goose 2> err.txt > /dev/null || code=$?
          test "$code" = 2
          grep -q "CO802" err.txt
          # Two regex rules report under their own id. A rule never
          # takes the id of another rule.
          printf '{"rules":[{"id":"CO820","severity":"low","kind":"regex","text":"TODO"},{"id":"CO821","severity":"high","kind":"regex","text":"eval\\\\("}]}\n' > rx2.json
          printf 'eval(x)\n' > rx2.goose
          "$RUNNER_TEMP/sast" -no-fail -rules rx2.json rx2.goose > out.txt
          grep -q "CO821" out.txt
          if grep -q "CO820" out.txt; then echo "a regex rule took the id of another rule"; exit 1; fi
          # The example policies and advisories give the exit codes that
          # the examples directory states.
          code=0; "$RUNNER_TEMP/sast" -no-config -policy examples/policy/strict.json \
            -advisories examples/advisories/several.json examples/policy/root-bad.goose > /dev/null || code=$?
          test "$code" = 15
          code=0; "$RUNNER_TEMP/sast" -no-config -policy examples/policy/permissive.json \
            examples/policy/root-bad.goose > /dev/null || code=$?
          test "$code" = 8
          "$RUNNER_TEMP/sast" -no-config -policy examples/policy/strict.json \
            -advisories examples/advisories/several.json examples/policy/root-clean.goose > /dev/null
          for f in secrets house-style comments regex; do
            "$RUNNER_TEMP/sast" -no-fail -no-config -rules "examples/rules/$f.json" examples/samples/secrets.goose > /dev/null
          done
        env:
          GOOSE_HOME: ${{ runner.temp }}/goose-home

      - name: Report the failure
        if: failure()
        run: |
          text=$(tail -c 2000 test-output.txt 2>/dev/null | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' '%0A')
          echo "::error title=The tests failed::${text}"
